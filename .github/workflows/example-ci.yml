# Proves the harness in this kit actually works, by running it on the example project.
name: example-ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  colony-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: example/colony_sim
    steps:
      - uses: actions/checkout@v5

      - name: Harness copy in example is identical to the kit
        working-directory: .
        run: diff -r harness/godot/harness example/colony_sim/harness

      - name: Shell scripts pass shellcheck
        working-directory: .
        run: shellcheck -S warning harness/godot/harness/gw.sh scripts/install.sh scripts/update-harness.sh

      - name: Download Godot
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Check (import + tests + smoke)
        env:
          GODOT: /home/runner/godot/godot
          GW_VERBOSE: "1"
        run: ./harness/gw.sh check

      - name: Harness catches a failing test (canary)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          mkdir -p tests/unit
          printf 'extends "res://harness/gw_test.gd"\nfunc test_canary_must_fail() -> void:\n\tassert_eq(1, 2, "canary")\n' > tests/unit/test_zz_canary.gd
          if ./harness/gw.sh test unit canary; then echo "runner did NOT report the failure"; exit 1; fi
          rm tests/unit/test_zz_canary.gd
          echo "runner correctly failed on the canary"

      - name: Harness catches a script error (canary)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          printf 'extends "res://harness/gw_test.gd"\nfunc test_canary_crash() -> void:\n\tvar d := {}\n\tvar x: int = d["missing"].size()\n' > tests/unit/test_zz_crash.gd
          if ./harness/gw.sh test unit crash; then echo "gw.sh did NOT catch the script error"; exit 1; fi
          # the runner on its own (no gw.sh grep) must fail the crashing test by name
          if "$GODOT" --headless --path . -s res://harness/test_runner.gd -- --tier=unit --filter=crash > crash.out 2>&1; then cat crash.out; echo "runner exited 0 on a script error"; exit 1; fi
          grep -q 'FAIL \[unit\] test_zz_crash.gd::test_canary_crash' crash.out || { cat crash.out; echo "crash not attributed to the test"; exit 1; }
          grep -q 'RESULT FAILED' crash.out || { cat crash.out; echo "summary line not FAILED"; exit 1; }
          rm tests/unit/test_zz_crash.gd crash.out
          echo "runner correctly failed on the script error"

      - name: Harness fails a test that waits forever (canary)
        env:
          GODOT: /home/runner/godot/godot
          GW_TEST_TIMEOUT: "3"
        run: |
          printf 'extends "res://harness/gw_test.gd"\nfunc test_canary_wait() -> void:\n\tawait wait_seconds(999)\n' > tests/unit/test_zz_wait.gd
          if ./harness/gw.sh test unit wait > wait.out; then cat wait.out; echo "a hanging test passed"; exit 1; fi
          grep -q 'timed out' wait.out || { cat wait.out; echo "no timeout message"; exit 1; }
          rm tests/unit/test_zz_wait.gd wait.out
          echo "runner correctly timed out the waiting test"

      - name: Harness kills an endless loop (canary)
        env:
          GODOT: /home/runner/godot/godot
          GW_TIMEOUT: "15"
        run: |
          printf 'extends "res://harness/gw_test.gd"\nfunc test_canary_loop() -> void:\n\tvar i := 0\n\twhile true:\n\t\ti += 1\n' > tests/unit/test_zz_loop.gd
          if ./harness/gw.sh test unit loop > loop.out; then cat loop.out; echo "an endless loop passed"; exit 1; fi
          grep -q 'stopped after 15s' loop.out || { cat loop.out; echo "no time-limit message"; exit 1; }
          rm tests/unit/test_zz_loop.gd loop.out
          echo "gw.sh correctly stopped the endless loop"

      - name: Pre-commit hook blocks a red commit (canary)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          git config user.email ci@example.com && git config user.name ci
          ./harness/gw.sh hooks
          printf 'extends "res://harness/gw_test.gd"\nfunc test_canary_red() -> void:\n\tassert_eq(1, 2, "canary")\n' > tests/unit/test_zz_red.gd
          git add tests/unit/test_zz_red.gd
          if git commit -m "red canary"; then echo "hook let a red commit through"; exit 1; fi
          git rm -q --cached tests/unit/test_zz_red.gd && rm tests/unit/test_zz_red.gd
          echo "docs only" >> docs/LOG.md && git add docs/LOG.md
          git commit -q -m "docs canary" || { echo "hook blocked a docs-only commit"; exit 1; }
          echo "hook blocks red commits and lets docs-only commits through"

      - name: Sim runner, run twice to prove determinism (same digest)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          set -o pipefail
          ./harness/gw.sh sim --seeds=1-10 --ticks=500 | tee sim1.out
          ./harness/gw.sh sim --seeds=1-10 --ticks=500 > sim2.out
          a=$(grep '^DIGEST' sim1.out); b=$(grep '^DIGEST' sim2.out)
          [[ -n "$a" && "$a" == "$b" ]] || { echo "digests differ or missing: '$a' vs '$b'"; exit 1; }
          echo "deterministic: $a"

      - name: Screenshot (xvfb)
        env:
          GODOT: /home/runner/godot/godot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          ./harness/gw.sh shot "" 45 || echo "screenshot step failed (non-fatal on CI)"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: colony-sim-reports
          path: example/colony_sim/reports/
          if-no-files-found: ignore
